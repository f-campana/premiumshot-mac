name: Private beta draft
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ARCH: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Package the committed private beta
        run: make release
      - name: Create a draft for owner review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp docs/beta-installation.md build/release-notes.md
          printf '\nSHA-256: `%s`\n' "$(cut -d ' ' -f 1 out/*.sha256)" >> build/release-notes.md
          gh release create "$GITHUB_REF_NAME" out/*.dmg out/*.sha256 out/*.json \
            --verify-tag --draft --title "PremiumShot ${GITHUB_REF_NAME#v} private beta" \
            --notes-file build/release-notes.md
